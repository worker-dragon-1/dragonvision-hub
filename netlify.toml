[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path serves index.html (client-side routing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and manifest must never be served stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Google sign-in uses a popup; same-origin-allow-popups keeps it working.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
